<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Gestión de Usuarios - Spring Boot</title>
</head>
<body>
    <div style="margin: 20px;">
        <h2>Gestión de Usuarios</h2>
        <a th:href="@{/}">← Volver al Menú Principal</a> | 
        <a th:href="@{/usuarios/nuevo}">+ Agregar Nuevo Usuario</a>
        <hr/>

        <div th:if="${param.mensaje}" style="color: green;" th:text="${param.mensaje}"></div>

        <h3>Filtros y Reportes Parametrizados (Usuario)</h3>
        <form th:action="@{/usuarios/reporte/rol}" method="get" style="display: inline-block; margin-right: 20px;">
            <label>Filtrar por Rol:</label>
            <select name="rol">
                <option value="admin">Admin</option>
                <option value="empleado">Empleado</option>
            </select>
            <button type="submit">Buscar por Rol</button>
        </form>

        <form th:action="@{/usuarios/reporte/nombre}" method="get" style="display: inline-block;">
            <label>Búsqueda por Nombre:</label>
            <input type="text" name="nombre" placeholder="Nombre..." required="required"/>
            <button type="submit">Buscar</button>
            <a th:href="@{/usuarios}">Limpiar Filtros</a>
        </form>

        <br/><br/>
        <table border="1" cellpadding="8" cellspacing="0" style="width: 100%;">
            <thead style="background-color: #e9e9e9;">
                <tr>
                    <th>ID</th>
                    <th>Nombre</th>
                    <th>Email</th>
                    <th>Rol</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="u : ${usuarios}">
                    <td th:text="${u.id}">1</td>
                    <td th:text="${u.nombre}">Nombre</td>
                    <td th:text="${u.email}">email@domain.com</td>
                    <td th:text="${u.rol}">admin</td>
                    <td>
                        <a th:href="@{'/usuarios/editar/' + ${u.id}}">Editar</a> | 
                        <a th:href="@{'/usuarios/eliminar/' + ${u.id}}" onclick="return confirm('¿Seguro de eliminar este usuario?');">Eliminar</a>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(usuarios)}">
                    <td colspan="5" style="text-align: center; color: gray;">No se encontraron usuarios registrados.</td>
                </tr>
            </tbody>
        </table>
    </div>
</body>
</html>
